<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <title>SlugFest - Profile</title>
</head>

<body style="padding-top: 100px;">

    <!-- Navigation Bar -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">

            <a class="navbar-brand" href="feed.html">SlugFest</a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="feed.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="feed.html#slimeCompose">
                            Compose
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="profile.html">
                            Profile
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html">
                            Notifications
                        </a>
                    </li>
                </ul>

                <!-- Search Bar -->
                <form class="d-flex">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input class="form-control me-2"
                               type="search"
                               placeholder="Search"
                               aria-label="Search">

                        <button type="button" class="btn btn-info">
                            <i class="bi bi-chevron-bar-right"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Profile Card Section -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">

                <!-- Generated dynamically by CreateProfileCard() -->
                <div id="profile-card"></div>

            </div>
        </div>

        <!-- Reusable Profile Card Template -->
        <template id="profile-template">
            <div class="row align-items-center g-4">

                <!-- Profile Image -->
                <div class="col-12 col-md-4 text-center">
                    <img id="profile_image"
                        class="rounded-circle"
                        style="width: 100%;
                                max-width: 180px;
                                aspect-ratio: 1 / 1;
                                object-fit: cover;"
                        alt="">
                </div>

                <!-- Profile Information -->
                <div class="col-12 col-md-8">

                    <div class="mb-3">
                        <h1 id="profile_name"></h1>

                        <span id="profile_username"
                              class="text-muted lead"></span>
                    </div>

                    <p id="profile_description" class="mb-3"></p>

                    <!-- Joined Date -->
                    <div class="text-muted mb-2">
                        <i class="bi bi-calendar3"></i>
                        <span id="profile-joined"></span>
                    </div>

                    <!-- Following and Followers -->
                    <div class="text-muted">
                        <span id="profile_following" class="me-3"></span>
                        <span id="profile_followers" class="me-3"></span>
                    </div>

                    <!-- Edit Profile -->
                    <button id="edit-profile"
                            type="button"
                            class="btn btn-outline-primary mt-3">
                        Edit Profile
                    </button>

                </div>
            </div>
        </template>

        <!-- Profile Slimes Section -->
        <div class="row justify-content-center">

            <div class="col-md-8">

                <!-- Slime Navigation Tabs -->
                <nav class="mb-3">
                    <ul class="nav nav-pills nav-fill" role="tablist">

                        <li class="nav-item" role="presentation">
                            <button class="nav-link active"
                                    id="nav-slimes-tab"
                                    data-bs-toggle="pill"
                                    data-bs-target="#slimes"
                                    type="button"
                                    role="tab"
                                    aria-controls="slimes"
                                    aria-selected="true">
                                Slimes
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                    id="nav-replies-tab"
                                    data-bs-toggle="pill"
                                    data-bs-target="#replies"
                                    type="button"
                                    role="tab"
                                    aria-controls="replies"
                                    aria-selected="false">
                                Slimes and Replies
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                    id="nav-favorites-tab"
                                    data-bs-toggle="pill"
                                    data-bs-target="#favorites"
                                    type="button"
                                    role="tab"
                                    aria-controls="favorites"
                                    aria-selected="false">
                                Favorites
                            </button>
                        </li>

                    </ul>
                </nav>

                <!-- Tab Content -->
                <div class="tab-content" id="slimes-tabContent">

                    <div class="tab-pane fade show active"
                         id="slimes"
                         role="tabpanel"
                         aria-labelledby="nav-slimes-tab">
                        <!-- FIXME: Dynamically generated slimes -->
                    </div>

                    <div class="tab-pane fade"
                         id="replies"
                         role="tabpanel"
                         aria-labelledby="nav-replies-tab">
                        <!-- FIXME: Slimes and Replies -->
                    </div>

                    <div class="tab-pane fade"
                         id="favorites"
                         role="tabpanel"
                         aria-labelledby="nav-favorites-tab">
                        <!-- FIXME: Favorites -->
                    </div>

                </div>

            </div>
        </div>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>

    <!-- Profile Page Integration -->
    <script type="module" src="../../js/integration/profilePage.js"></script>

    <!--Profile Slimes integration-->
    ,<script type="module" src="../../js/integration/profileSlimes.js"></script>

    <!--favorites integration-->
    <script type="module" src="../../js/integration/favorite.js"></script>

    <!--replies integration-->
    <script type="module" src="../../js/integration/slimesReplies.js"></script>


</body>
</html>
